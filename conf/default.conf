
# Comprehensive Vilgax configuration covering the supported directives.
# This example is intentionally large and uses the full global and per-server
# configuration surface supported by the lexer and parser.

workers auto;
user www-data;
group www-data;
pid_file /var/run/vilgax.pid;
access_log /var/log/vilgax/access.log;
error_log /var/log/vilgax/error.log;

max_connections 4096;
max_connections_per_worker 512;

max_request_line_size 8192;
max_header_size 16384;
max_headers 100;
client_max_body_size 1048576;
max_requests_per_connection 100;

keepalive on;
sendfile on;
sendfile_min_size 4096;

backlog 511;

timeout_request_line 30000;
timeout_headers 5000;
timeout_body 60000;
timeout_write 30000;

server {
    server_name example.com www.example.com;
    root /srv/www/example;
    index index.html index.htm default.html;
    autoindex off;
    error_pages 404 403 410 /srv/www/errors/4xx.html;
    
    listen 0.0.0.0:80 2048;
    listen 127.0.0.1:8080 1024;

    
    redirect /legacy/old-home 301;
    sendfile on;
    sendfile_min_size 2048;
    keepalive 65;

    location / {
        root /srv/www/example/public;
        index index.html index.htm;
        autoindex on;
        client_max_body_size 2097152;
        redirect /landing 302;
    }

    location /assets {
        root /srv/www/example/assets;
        index default.html;
        autoindex off;
    }

    location /assets/images {
        root /srv/www/example/assets/images;
        index preview.html;
        autoindex off;

        location /assets/images/gallery {
            root /srv/www/example/assets/images/gallery;
            index gallery.html;
            autoindex on;
        }
    }

    location /api {
        root /srv/www/example/api;
        index index.json;
        autoindex off;
        client_max_body_size 10485760;
    }

    location /app {
        root /srv/www/example/app;
        index index.php front-controller.php;
        autoindex off;
        fastcgi {
            listen 127.0.0.1:9000;
            fastcgi_timeout_connect 5000;
            fastcgi_timeout_read 30000;
        }

        location /app/admin {
            root /srv/www/example/app/admin;
            index index.php;
            autoindex off;
            redirect /app 307;
        }
    }
}

server {
    server_name api.internal internal-api.local;
    root /srv/www/api;
    index index.json openapi.json;
    autoindex off;
    error_pages 500 502 503 504 /srv/www/errors/5xx.html;
    listen 127.0.0.1:8081 256;
    listen ::1:8082 128;
    sendfile on;
    sendfile_min_size 1024;
    keepalive 120;

    location /health {
        root /srv/www/health;
        index health.txt;
        autoindex off;
    }

    location /metrics {
        root /srv/www/metrics;
        index metrics.json;
        autoindex off;
        client_max_body_size 5242880;
    }
}

server {
    server_name admin.example.com;
    root /srv/www/admin;
    index index.html;
    autoindex off;
    listen 10.0.0.12:443 2048;
    sendfile on;
    sendfile_min_size 8192;
    keepalive 30;

    location / {
        root /srv/www/admin/ui;
        index index.html dashboard.html;
        autoindex off;
    }

    location /static {
        root /srv/www/admin/static;
        index index.html;
        autoindex on;
    }
}
