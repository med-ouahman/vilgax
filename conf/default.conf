server
# Vilgax HTTP Server Configuration

# Number of worker processes (auto = number of CPU cores)
workers auto;

# User and group to run the server as
user www-data;
group www-data;

# PID file location
pid_file /var/run/vilgax.pid;

# Logging configuration
access_log /var/log/vilgax/access.log;
error_log /var/log/vilgax/error.log;

# Connection limits
max_connections 1024;
max_connections_per_worker 256;

# Request size limits
max_request_line_size 8192;
max_header_size 16384;
client_body_max_size 1048576;

# Timeouts (in milliseconds)
timeout_request_line 30000;
timeout_headers 30000;
timeout_body 30000;
timeout_write 30000;

# Per-connection request limit
max_requests_per_connection 100;

# Server block
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # Static content
    location / {
        root /var/www/html;
        autoindex off;
        index index.html;
    }

    # FastCGI backend
    location /app {
        root /var/www/app;
        fastcgi 127.0.0.1:9000;
        fastcgi_timeout_connect 5000;
        fastcgi_timeout_read 30000;
    }

    # Caching settings
    sendfile on;
    sendfile_min_size 1024;
    keepalive 65;
};

# HTTPS Server (optional)
server {
    listen 0.0.0.0:443;
    server_name example.com www.example.com;

    root /var/www/example;
    index index.html index.htm;
    autoindex off;

    max_request_line_size 4096;
    client_body_max_size 10485760;

    sendfile on;
    sendfile_min_size 2048;
    keepalive 120;
};
